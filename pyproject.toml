[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "findex"
version = "0.7.0"
description = "Custom search engine with FastAPI web interface, BM25, Async Crawler and CLI"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Volodymyr Klimanov" }
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "selectolax>=0.3.21",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "jinja2>=3.1.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "hypothesis>=6.0.0",
    "pyright>=1.1.0",
    "ruff>=0.1.0",
    "psutil>=5.9.0",
    "matplotlib>=3.7.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0"
]

[project.scripts]
findex = "findex.cli:app"

[tool.pyright]
typeCheckingMode = "strict"
include = ["src"]
exclude = ["tests", ".venv"]
reportMissingImports = true
reportUnusedImport = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/findex"]
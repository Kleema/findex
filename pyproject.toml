[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "findex"
version = "0.5.0"
description = "Custom search engine with inverted index, BM25, and CLI"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Volodymyr Klimanov" }
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "hypothesis>=6.0.0",
    "pyright>=1.1.0",
    "ruff>=0.1.0",
    "psutil>=5.9.0",
    "matplotlib>=3.7.0"
]

[project.scripts]
findex = "findex.cli:app"

[tool.pyright]
typeCheckingMode = "strict"
include = ["src"]
exclude = ["tests", ".venv"]
reportMissingImports = true
reportUnusedImport = true

[tool.hatch.build.targets.wheel]
packages = ["src/findex"]
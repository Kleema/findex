name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run Ruff (Linter)
        run: uv run ruff check .

      - name: Run Pyright (Type Checker)
        run: uv run pyright

      - name: Run Pytest
        run: uv run pytest --cov=findex --cov-report=xml

      - name: Build Wheel
        run: uv build